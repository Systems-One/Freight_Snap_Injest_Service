name: Build, Test and Package Installer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2025
    name: Run Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore FreightSnapIngestService.sln

      - name: Build
        run: dotnet build FreightSnapIngestService.sln --configuration Release --no-restore --warnaserror

      - name: Run tests
        run: >
          dotnet test tests/FreightSnapIngestService.Tests/FreightSnapIngestService.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/FreightSnapIngestService.Tests/TestResults/test-results.trx

  build-and-release:
    runs-on: windows-2025
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore FreightSnapIngestService.sln

      - name: Build
        run: dotnet build FreightSnapIngestService.sln --configuration Release --no-restore --warnaserror

      - name: Set version
        id: version
        run: |
          $numeric = "$(Get-Date -Format 'yyyy.MM.dd').${{ github.run_number }}"
          $tag = "v$numeric"
          echo "VERSION=$tag" >> $env:GITHUB_OUTPUT
          echo "VERSION_NUMERIC=$numeric" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Publish application
        run: >
          dotnet publish src/FreightSnapIngestService/FreightSnapIngestService.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output ./publish
          -p:PublishSingleFile=false

      - name: Deploy database schema script
        run: Copy-Item -Path db/schema.sql -Destination ./publish/schema.sql
        shell: pwsh

      - name: Build Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: setup.iss
          options: /O+ /DMyAppVersion=${{ steps.version.outputs.VERSION_NUMERIC }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Release ${{ steps.version.outputs.VERSION }}"
          body: |
            Automated release built from commit ${{ github.sha }}.

            ### What's included
            - `Freight_Snap_Ingest_Service_Setup.exe` — Windows installer for the Freight Snap Ingest Service

            ### Installation
            Run the installer as Administrator. It will publish the app, install it as a Windows
            Service (`FreightSnapIngestService`), and start it automatically.

            ### Post-install: apply the database schema and configure directories
            Run the included `schema.sql` against your target SQL Server database once, and edit
            `appsettings.json` in the install directory with real directory paths and a connection
            string before starting real ingestion. See the [README](https://github.com/Jwagener1/Freight_Snap_Injest_Service#configure)
            for the full configuration reference.
          files: installer_output/Freight_Snap_Ingest_Service_Setup.exe
          draft: false
          prerelease: false
